[package]
name = "mip-codex"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
lto = "thin"

[dependencies]
faer = { version = "0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
flate2 = "1.1.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
