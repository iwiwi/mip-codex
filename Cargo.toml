[package]
name = "mip-codex"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A Rust MILP solver with independently checked solutions"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
faer = { version = "0.23", default-features = false, features = ["std", "sparse-linalg"] }

[profile.release]
lto = "thin"
codegen-units = 1
